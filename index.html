<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>수학 사진 풀이</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #0f1419;
  --card: #1a2332;
  --card2: #243044;
  --border: #2d3a4f;
  --text: #e8eef6;
  --muted: #8b9bb4;
  --accent: #4f8cff;
  --accent2: #3d7aef;
  --good: #2ecc71;
  --warn: #f5a623;
  --bad: #ff6b6b;
  --ans: #1e3a2f;
  --ans-border: #2ecc71;
  --radius: 16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  min-height: 100%;
  line-height: 1.55;
}
body { padding-bottom: calc(24px + var(--safe-b)); }
button, input, select, textarea { font: inherit; color: inherit; }
.app { max-width: 480px; margin: 0 auto; padding: 16px 16px 40px; }
.top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 40px; height: 40px; border-radius: 12px;
  background: linear-gradient(135deg, #4f8cff, #7b5cff);
  display: grid; place-items: center; font-size: 20px; font-weight: 800;
  box-shadow: 0 6px 20px rgba(79,140,255,.35);
}
.brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.brand p { font-size: 12px; color: var(--muted); margin-top: 1px; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--card);
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn:active { transform: scale(.96); }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
}
.card h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
.level-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.level-btn {
  border: 1px solid var(--border); background: var(--card2);
  border-radius: 12px; padding: 10px 0; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: .15s;
}
.level-btn.active {
  background: rgba(79,140,255,.18); border-color: var(--accent); color: #9ec0ff;
}
.upload-zone {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 28px 16px; text-align: center; background: var(--card2);
  cursor: pointer; position: relative; overflow: hidden;
}
.upload-zone.has-img { padding: 0; border-style: solid; }
.upload-zone .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
.upload-zone .big { font-size: 36px; margin-bottom: 6px; }
#previewImg {
  display: none; width: 100%; max-height: 320px; object-fit: contain;
  background: #000; border-radius: calc(var(--radius) - 2px);
}
.upload-actions { display: flex; gap: 8px; margin-top: 12px; }
.btn {
  flex: 1; border: none; border-radius: 14px; padding: 14px 12px;
  font-weight: 700; font-size: 15px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, #4f8cff, #3d7aef); color: #fff; }
.btn-secondary { background: var(--card2); border: 1px solid var(--border); color: var(--text); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-danger { background: rgba(255,107,107,.12); border: 1px solid rgba(255,107,107,.35); color: #ff8e8e; }
.status {
  display: none; margin-top: 12px; padding: 12px 14px; border-radius: 12px;
  font-size: 13px; line-height: 1.45;
}
.status.show { display: block; }
.status.info { background: rgba(79,140,255,.12); border: 1px solid rgba(79,140,255,.3); color: #9ec0ff; }
.status.err { background: rgba(255,107,107,.12); border: 1px solid rgba(255,107,107,.3); color: #ffb0b0; }
.status.ok { background: rgba(46,204,113,.12); border: 1px solid rgba(46,204,113,.3); color: #7ddea8; }
.spinner {
  width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.25);
  border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }
.solution { display: none; }
.solution.show { display: block; }
.sol-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; gap: 8px;
}
.sol-header h2 { font-size: 16px; color: var(--text); margin: 0; }
.badge {
  font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px;
  background: rgba(79,140,255,.15); color: #9ec0ff; border: 1px solid rgba(79,140,255,.3);
}
.problem-box {
  background: var(--card2); border-radius: 12px; padding: 12px 14px;
  margin-bottom: 12px; font-size: 14px; border-left: 3px solid var(--accent);
}
.problem-box .label { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
.steps { font-size: 14.5px; }
.steps .step {
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.steps .step:last-child { border-bottom: none; }
.steps .step-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(79,140,255,.2); color: #9ec0ff;
  font-size: 12px; font-weight: 800; margin-right: 8px; vertical-align: middle;
}
.answer-box {
  margin-top: 14px; background: var(--ans); border: 1.5px solid var(--ans-border);
  border-radius: 14px; padding: 14px 16px;
}
.answer-box .label { font-size: 12px; color: var(--good); font-weight: 800; margin-bottom: 6px; }
.answer-box .ans { font-size: 18px; font-weight: 700; }
.follow {
  margin-top: 14px; display: flex; gap: 8px;
}
.follow input, .follow textarea {
  flex: 1; background: var(--card2); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px; outline: none; resize: none;
}
.follow input:focus, .follow textarea:focus { border-color: var(--accent); }
.follow input { min-width: 0; }
.btn { white-space: nowrap; }
.follow-btn { flex: 0 0 auto; width: auto; padding: 12px 16px; }
.history-list { display: flex; flex-direction: column; gap: 10px; }
.hist-item {
  display: flex; gap: 12px; align-items: center;
  background: var(--card2); border-radius: 12px; padding: 10px;
  cursor: pointer; border: 1px solid transparent;
}
.hist-item:active { border-color: var(--accent); }
.hist-thumb {
  width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: #000; flex-shrink: 0;
}
.hist-meta { flex: 1; min-width: 0; }
.hist-meta .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist-meta .d { font-size: 11px; color: var(--muted); margin-top: 3px; }
.hist-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 18px 0; }
.overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55);
  z-index: 40; backdrop-filter: blur(4px);
}
.overlay.show { display: block; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: var(--card); border-radius: 20px 20px 0 0;
  padding: 12px 18px calc(24px + var(--safe-b));
  transform: translateY(110%); transition: transform .28s ease;
  max-height: 88vh; overflow-y: auto; max-width: 480px; margin: 0 auto;
  border: 1px solid var(--border); border-bottom: none;
}
.sheet.show { transform: translateY(0); visibility: visible; }
.sheet:not(.show) { visibility: hidden; }
.sheet .handle {
  width: 40px; height: 4px; background: var(--border); border-radius: 4px;
  margin: 4px auto 16px;
}
.sheet h3 { font-size: 17px; margin-bottom: 14px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.field input, .field select {
  width: 100%; background: var(--card2); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px; outline: none;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.field .note { font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
.provider-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.provider-tab {
  border: 1px solid var(--border); background: var(--card2); border-radius: 12px;
  padding: 12px; text-align: center; cursor: pointer; font-weight: 700; font-size: 13px;
}
.provider-tab.active { border-color: var(--accent); background: rgba(79,140,255,.15); color: #9ec0ff; }
.katex { font-size: 1.05em; }
.katex-display { margin: 10px 0; overflow-x: auto; overflow-y: hidden; }
.markdown p { margin: 0 0 8px; }
.markdown ul, .markdown ol { padding-left: 1.2em; margin: 6px 0; }
.markdown code {
  background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 4px; font-size: .92em;
}
.hidden { display: none !important; }
.mock-banner {
  display: none; background: rgba(245,166,35,.15); border: 1px solid rgba(245,166,35,.4);
  color: #ffd28a; border-radius: 12px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 14px;
}
.mock-banner.show { display: block; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <div class="logo">∑</div>
      <div>
        <h1>수학 사진 풀이</h1>
        <p>사진 찍으면 단계별 해설</p>
      </div>
    </div>
    <button class="icon-btn" id="btnSettings" aria-label="설정" type="button">⚙️</button>
  </div>

  <div class="mock-banner" id="mockBanner">🧪 모의 모드 (?mock=1) — 실제 API 호출 없이 샘플 풀이를 보여줍니다.</div>

  <div class="card">
    <h2>난이도 (설명 깊이)</h2>
    <div class="level-row" id="levelRow">
      <button type="button" class="level-btn" data-level="초등">초등</button>
      <button type="button" class="level-btn" data-level="중등">중등</button>
      <button type="button" class="level-btn active" data-level="고등">고등</button>
      <button type="button" class="level-btn" data-level="대학">대학</button>
    </div>
  </div>

  <div class="card" id="uploadCard">
    <div class="upload-zone" id="uploadZone">
      <div id="uploadPlaceholder">
        <div class="big">📷</div>
        <div style="font-weight:700;font-size:15px">문제 사진 찍기 / 올리기</div>
        <div class="hint">카메라로 찍거나 갤러리에서 선택하세요</div>
      </div>
      <img id="previewImg" alt="문제 미리보기">
      <input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden">
    </div>
    <div class="upload-actions">
      <button type="button" class="btn btn-secondary" id="btnPick">사진 선택</button>
      <button type="button" class="btn btn-primary" id="btnSolve" disabled>풀이하기</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card solution" id="solutionCard">
    <div class="sol-header">
      <h2>풀이 결과</h2>
      <span class="badge" id="levelBadge">고등</span>
    </div>
    <div class="problem-box">
      <div class="label">문제 인식</div>
      <div class="markdown" id="problemText"></div>
    </div>
    <div class="steps markdown" id="stepsText"></div>
    <div class="answer-box">
      <div class="label">정답</div>
      <div class="ans markdown" id="answerText"></div>
    </div>
    <div class="upload-actions" style="margin-top:14px">
      <button type="button" class="btn btn-secondary" id="btnRetry">다시 풀기</button>
      <button type="button" class="btn btn-ghost" id="btnNew">새 문제</button>
    </div>
    <div style="margin-top:16px">
      <h2 style="font-size:13px;color:var(--muted);margin-bottom:8px">추가 질문</h2>
      <div class="follow">
        <input type="text" id="followInput" placeholder="이 문제에 대해 더 궁금한 점…" autocomplete="off">
        <button type="button" class="btn btn-primary follow-btn" id="btnFollow">질문</button>
      </div>
      <div class="markdown" id="followAnswer" style="margin-top:12px;font-size:14px"></div>
    </div>
  </div>

  <div class="card" id="historyCard">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 style="margin:0">최근 풀이</h2>
      <button type="button" class="btn btn-ghost" id="btnClearHist" style="flex:0;padding:6px 10px;font-size:12px">전체 삭제</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="hist-empty">아직 풀이 기록이 없어요</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="settingsSheet" role="dialog" aria-label="설정">
  <div class="handle"></div>
  <h3>API 설정</h3>
  <div class="provider-tabs">
    <button type="button" class="provider-tab active" data-provider="gemini">Google Gemini</button>
    <button type="button" class="provider-tab" data-provider="openai">OpenAI</button>
  </div>
  <div class="field">
    <label for="apiKey">API 키</label>
    <input type="password" id="apiKey" placeholder="여기에 API 키 입력" autocomplete="off">
    <div class="note">키는 이 기기의 브라우저(localStorage)에만 저장되며, 서버로 전송되지 않습니다. 무료 Gemini 키는 Google AI Studio(aistudio.google.com)에서 발급할 수 있어요.</div>
  </div>
  <div class="field" id="modelField">
    <label for="modelSelect">모델</label>
    <select id="modelSelect">
      <option value="gemini-2.5-flash">gemini-2.5-flash (기본)</option>
      <option value="gemini-2.0-flash">gemini-2.0-flash</option>
      <option value="gemini-1.5-flash">gemini-1.5-flash</option>
    </select>
  </div>
  <div class="upload-actions">
    <button type="button" class="btn btn-secondary" id="btnCloseSettings">닫기</button>
    <button type="button" class="btn btn-primary" id="btnSaveSettings">저장</button>
  </div>
  <button type="button" class="btn btn-danger" id="btnClearKey" style="width:100%;margin-top:10px">저장된 키 삭제</button>
</div>

<script>
(function () {
  'use strict';

  const MOCK = new URLSearchParams(location.search).get('mock') === '1';
  const LS_KEY = 'mathSolver.settings.v1';
  const LS_HIST = 'mathSolver.history.v1';
  const MAX_HIST = 20;
  const MAX_IMG = 1600;

  const el = (id) => document.getElementById(id);
  const uploadZone = el('uploadZone');
  const fileInput = el('fileInput');
  const previewImg = el('previewImg');
  const uploadPlaceholder = el('uploadPlaceholder');
  const btnPick = el('btnPick');
  const btnSolve = el('btnSolve');
  const btnRetry = el('btnRetry');
  const btnNew = el('btnNew');
  const btnFollow = el('btnFollow');
  const followInput = el('followInput');
  const followAnswer = el('followAnswer');
  const statusEl = el('status');
  const solutionCard = el('solutionCard');
  const problemText = el('problemText');
  const stepsText = el('stepsText');
  const answerText = el('answerText');
  const levelBadge = el('levelBadge');
  const historyList = el('historyList');
  const overlay = el('overlay');
  const sheet = el('settingsSheet');
  const apiKeyInput = el('apiKey');
  const modelSelect = el('modelSelect');

  let currentLevel = '고등';
  let currentProvider = 'gemini';
  let currentImageDataUrl = null;
  let currentImageMime = 'image/jpeg';
  let lastSolution = null;
  let lastConversation = [];

  const OPENAI_MODELS = [
    { value: 'gpt-4o-mini', label: 'gpt-4o-mini (기본)' },
    { value: 'gpt-4o', label: 'gpt-4o' }
  ];
  const GEMINI_MODELS = [
    { value: 'gemini-3.8-flash', label: 'gemini-3.8-flash (기본)' },
    { value: 'gemini-3-flash-preview', label: 'gemini-3-flash-preview' },
    { value: 'gemini-flash-lite-latest', label: 'gemini-flash-lite-latest (빠름)' }
  ];

  if (MOCK) el('mockBanner').classList.add('show');

  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      currentProvider = s.provider === 'openai' ? 'openai' : 'gemini';
      apiKeyInput.value = s.apiKey || '';
      refreshModelOptions(s.model);
      document.querySelectorAll('.provider-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.provider === currentProvider);
      });
      if (s.level && ['초등','중등','고등','대학'].includes(s.level)) {
        currentLevel = s.level;
        document.querySelectorAll('.level-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.level === currentLevel);
        });
      }
    } catch (e) { /* ignore */ }
  }

  function saveSettings() {
    const model = modelSelect.value;
    localStorage.setItem(LS_KEY, JSON.stringify({
      provider: currentProvider,
      apiKey: apiKeyInput.value.trim(),
      model,
      level: currentLevel
    }));
  }

  function refreshModelOptions(preferred) {
    const list = currentProvider === 'openai' ? OPENAI_MODELS : GEMINI_MODELS;
    modelSelect.innerHTML = list.map(m =>
      `<option value="${m.value}">${m.label}</option>`
    ).join('');
    const def = list[0].value;
    modelSelect.value = list.some(m => m.value === preferred) ? preferred : def;
  }

  function setStatus(type, msg) {
    statusEl.className = 'status show ' + type;
    statusEl.innerHTML = msg;
  }
  function clearStatus() {
    statusEl.className = 'status';
    statusEl.innerHTML = '';
  }

  function openSettings() {
    overlay.classList.add('show');
    sheet.classList.add('show');
  }
  function closeSettings() {
    overlay.classList.remove('show');
    sheet.classList.remove('show');
  }

  el('btnSettings').addEventListener('click', openSettings);
  el('btnCloseSettings').addEventListener('click', closeSettings);
  overlay.addEventListener('click', closeSettings);
  el('btnSaveSettings').addEventListener('click', () => {
    saveSettings();
    closeSettings();
    setStatus('ok', '설정이 저장됐어요. API 키는 이 기기에만 보관됩니다.');
  });
  el('btnClearKey').addEventListener('click', () => {
    apiKeyInput.value = '';
    saveSettings();
    setStatus('info', '저장된 API 키를 삭제했어요.');
  });

  document.querySelectorAll('.provider-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentProvider = tab.dataset.provider;
      document.querySelectorAll('.provider-tab').forEach(t =>
        t.classList.toggle('active', t === tab)
      );
      refreshModelOptions();
    });
  });

  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = btn.dataset.level;
      document.querySelectorAll('.level-btn').forEach(b =>
        b.classList.toggle('active', b === btn)
      );
      saveSettings();
    });
  });

  btnPick.addEventListener('click', () => fileInput.click());
  uploadZone.addEventListener('click', (e) => {
    if (e.target === previewImg) return;
    if (!currentImageDataUrl) fileInput.click();
  });

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    try {
      clearStatus();
      setStatus('info', '이미지를 준비하는 중…');
      const dataUrl = await resizeImage(file, MAX_IMG);
      currentImageDataUrl = dataUrl;
      currentImageMime = dataUrl.startsWith('data:image/png') ? 'image/png' : 'image/jpeg';
      previewImg.src = dataUrl;
      previewImg.style.display = 'block';
      uploadPlaceholder.style.display = 'none';
      uploadZone.classList.add('has-img');
      btnSolve.disabled = false;
      clearStatus();
    } catch (err) {
      setStatus('err', '이미지를 불러오지 못했어요: ' + (err.message || err));
    }
  });

  function resizeImage(file, maxSide) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('파일 읽기 실패'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('이미지 디코딩 실패'));
        img.onload = () => {
          let { width, height } = img;
          const scale = Math.min(1, maxSide / Math.max(width, height));
          width = Math.round(width * scale);
          height = Math.round(height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
          resolve(canvas.toDataURL(mime, 0.88));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function levelGuidance(level) {
    switch (level) {
      case '초등':
        return '초등 수학 수준으로 아주 쉽게, 짧은 문장과 구체적 숫자 예로 설명하세요. 분수·소수·도형 기초 용어를 씁니다.';
      case '중등':
        return '중학교 교육과정(중1~중3) 용어를 사용하세요. 일차방정식·연립방정식·이차방정식, 일차함수·이차함수, 닮음, 피타고라스, 확률의 기초, 통계(평균·중앙값) 등. 중학생이 이해할 수 있게 중간 단계를 생략하지 마세요.';
      case '고등':

      case '대학':
        return '대학 미적분학·선형대수·해석학 수준의 엄밀한 용어를 사용하되, 핵심 단계는 생략하지 마세요.';
      default:
        return '';
    }
  }

  function buildSystemPrompt(level) {
    return [
      '당신은 한국 중·고등학생을 가르치는 수학 선생님입니다.',
      '사용자가 올린 문제 사진(또는 후속 질문)을 바탕으로 한국어로 풀이합니다.',
      '',
      '반드시 지킬 규칙:',
      '1) 먼저 사진에서 문제를 정확히 읽고 "문제 인식"을 한국어로 옮깁니다. 수식은 LaTeX($...$ 또는 $$...$$)로 씁니다.',
      '2) 그다음 단계별 풀이를 번호 매겨 제시합니다. 각 단계에서 "무엇을 왜 하는지"를 짧게 밝힙니다.',
      '3) 마지막에 답을 검산(대입·조건 확인·단위 확인 등)하고, 최종 답을 명확히 표시합니다.',
      '4) 사진이 흐리거나 글자를 읽기 어려우면 추측하지 말고, 읽을 수 없다고 솔직히 말하세요.',
      '5) 수식은 KaTeX가 렌더링할 수 있도록 표준 LaTeX만 사용합니다. \\( \\) 또는 $ $, \\[ \\] 또는 $$ $$ 를 씁니다.',
      '6) 응답은 반드시 아래 JSON 객체 하나만 출력하세요. JSON 외 텍스트 금지.',
      '',
      'JSON 스키마:',
      '{',
      '  "readable": true/false,',
      '  "problem": "인식한 문제 텍스트(LaTeX 포함 가능)",',
      '  "steps": ["단계1", "단계2", "..."],',
      '  "answer": "최종 정답(LaTeX 가능)",',
      '  "check": "검산/확인 한 줄",',

      '}',
      '',
      '난이도/설명 깊이: ' + level,

    ].join('\n');
  }

  function buildUserText() {
    return '첨부한 수학 문제 사진을 읽고, 지정한 JSON 형식으로 ' + currentLevel + ' 수준 풀이를 작성하세요.';
  }

  function dataUrlToBase64(dataUrl) {
    const i = dataUrl.indexOf(',');
    return dataUrl.slice(i + 1);
  }

  async function callGemini(messages, imageDataUrl) {
    const key = apiKeyInput.value.trim();
    if (!key) throw Object.assign(new Error('API 키가 없어요. 설정에서 Gemini API 키를 입력해주세요.'), { code: 'NO_KEY' });
    const model = modelSelect.value || 'gemini-3.8-flash';
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/' +
      encodeURIComponent(model) + ':generateContent';

    const parts = [];
    // system as first user instruction block
    const sys = buildSystemPrompt(currentLevel);
    const contents = [];

    // Build conversation
    if (imageDataUrl && messages.length === 0) {
      contents.push({
        role: 'user',
        parts: [
          { text: sys + '\n\n' + buildUserText() },
          {
            inline_data: {
              mime_type: currentImageMime,
              data: dataUrlToBase64(imageDataUrl)
            }
          }
        ]
      });
    } else {
      // follow-up: include prior context as text
      contents.push({
        role: 'user',
        parts: [{ text: sys + '\n\n이전 풀이 맥락:\n' + JSON.stringify(lastSolution) + '\n\n추가 질문: ' + messages[messages.length - 1] }]
      });
    }

    const body = {
      contents,
      generationConfig: {
        temperature: 0.2,
        responseMimeType: 'application/json'
      }
    };

    // 혼잡(503)·단종(404) 시 다른 모델로 자동 재시도
    const tryModels = [model, ...GEMINI_MODELS.map(m => m.value).filter(v => v !== model)];
    let res;
    for (let i = 0; i < tryModels.length; i++) {
      const u = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(tryModels[i]) + ':generateContent';
      try {
        res = await fetch(u, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
          body: JSON.stringify(body)
        });
      } catch (e) {
        throw Object.assign(new Error('네트워크 오류예요. 인터넷 연결을 확인해주세요.'), { code: 'NETWORK' });
      }
      if (!(res.status === 503 || res.status === 404 || res.status === 500) || i === tryModels.length - 1) break;
    }

    if (res.status === 401 || res.status === 403) {
      throw Object.assign(new Error('API 키가 유효하지 않거나 권한이 없어요. 키를 다시 확인해주세요.'), { code: 'BAD_KEY' });
    }
    if (res.status === 429) {
      throw Object.assign(new Error('요청이 너무 많아요(할당량/속도 제한). 잠시 후 다시 시도해주세요.'), { code: 'RATE' });
    }
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).error?.message || ''; } catch (_) {}
      throw Object.assign(new Error('Gemini 오류 (' + res.status + ')' + (detail ? ': ' + detail : '')), { code: 'API' });
    }
    const data = await res.json();
    const text = data?.candidates?.[0]?.content?.parts?.filter(p => !p.thought).map(p => p.text || '').join('') || '';
    if (!text) throw Object.assign(new Error('모델이 빈 응답을 보냈어요. 이미지를 다시 찍어보세요.'), { code: 'EMPTY' });
    return text;
  }

  async function callOpenAI(messages, imageDataUrl) {
    const key = apiKeyInput.value.trim();
    if (!key) throw Object.assign(new Error('API 키가 없어요. 설정에서 OpenAI API 키를 입력해주세요.'), { code: 'NO_KEY' });
    const model = modelSelect.value || 'gpt-4o-mini';
    const url = 'https://api.openai.com/v1/chat/completions';

    const chatMessages = [
      { role: 'system', content: buildSystemPrompt(currentLevel) }
    ];

    if (imageDataUrl && messages.length === 0) {
      chatMessages.push({
        role: 'user',
        content: [
          { type: 'text', text: buildUserText() },
          { type: 'image_url', image_url: { url: imageDataUrl } }
        ]
      });
    } else {
      chatMessages.push({
        role: 'user',
        content: '이전 풀이:\n' + JSON.stringify(lastSolution) + '\n\n추가 질문: ' + messages[messages.length - 1] +
          '\n\n같은 JSON 스키마로 답하되, problem은 기존 문제를 유지하고 steps/answer에 질문에 대한 설명을 담으세요.'
      });
    }

    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + key
        },
        body: JSON.stringify({
          model,
          temperature: 0.2,
          response_format: { type: 'json_object' },
          messages: chatMessages
        })
      });
    } catch (e) {
      throw Object.assign(new Error('네트워크 오류예요. 인터넷 연결을 확인해주세요.'), { code: 'NETWORK' });
    }

    if (res.status === 401) {
      throw Object.assign(new Error('API 키가 유효하지 않아요. OpenAI 키를 다시 확인해주세요.'), { code: 'BAD_KEY' });
    }
    if (res.status === 429) {
      throw Object.assign(new Error('요청이 너무 많아요(할당량/속도 제한). 잠시 후 다시 시도해주세요.'), { code: 'RATE' });
    }
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).error?.message || ''; } catch (_) {}
      throw Object.assign(new Error('OpenAI 오류 (' + res.status + ')' + (detail ? ': ' + detail : '')), { code: 'API' });
    }
    const data = await res.json();
    const text = data?.choices?.[0]?.message?.content || '';
    if (!text) throw Object.assign(new Error('모델이 빈 응답을 보냈어요.'), { code: 'EMPTY' });
    return text;
  }

  function getMockSolution() {
    // 고등 수학Ⅱ / 미적분: 극한·미분 연계 대표 유형
    return {
      readable: true,
      problem: '함수 $f(x)=x^{3}-3x^{2}+2$ 에 대하여\n(1) $\\displaystyle\\lim_{x\\to 1}\\dfrac{f(x)-f(1)}{x-1}$ 의 값을 구하시오.\n(2) 곡선 $y=f(x)$ 위의 점 $(1,\\,f(1))$ 에서의 접선의 방정식을 구하시오.',
      steps: [
        '**(1) 극한의 정의와 미분계수**\n주어진 극한은 $x=1$ 에서의 미분계수 $f\'(1)$ 과 같다.\n즉 $\\displaystyle\\lim_{x\\to 1}\\dfrac{f(x)-f(1)}{x-1}=f\'(1)$.',
        '먼저 $f(1)$ 을 구한다.\n$f(1)=1^{3}-3\\cdot 1^{2}+2=1-3+2=0$.',
        '$f(x)$ 를 미분한다. 거듭제곱의 미분법으로\n$f\'(x)=3x^{2}-6x$.',
        '$x=1$ 을 대입하면\n$f\'(1)=3\\cdot 1^{2}-6\\cdot 1=3-6=-3$.\n따라서 (1)의 극한값은 $-3$ 이다.',
        '**(2) 접선의 방정식**\n점 $(x_{0},\\,y_{0})$ 에서의 접선은\n$y-y_{0}=f\'(x_{0})(x-x_{0})$.\n여기서 $x_{0}=1$, $y_{0}=f(1)=0$, $f\'(1)=-3$ 이므로\n$y-0=-3(x-1)$\n$\\Rightarrow\\; y=-3x+3$.',
        '**(검산)** $f\'(x)=3x(x-2)$ 이므로 $f\'(1)=-3$ 이 맞다. 접선 $y=-3x+3$ 에 $x=1$ 을 넣으면 $y=0$ 으로 점 $(1,0)$ 을 지난다.'
      ],
      answer: '(1) $-3$  (2) $y=-3x+3$',
      check: '미분계수 정의와 접선 공식으로 검산 완료.',
      note: ''
    };
  }

  function parseSolution(raw) {
    let text = String(raw || '').trim();
    // strip markdown fences if any
    const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (fence) text = fence[1].trim();
    try {
      return JSON.parse(text);
    } catch (e) {
      // try to extract first {...}
      const m = text.match(/\{[\s\S]*\}/);
      if (m) {
        try { return JSON.parse(m[0]); } catch (_) {}
      }
      throw new Error('풀이 형식을 해석하지 못했어요. 다시 시도해주세요.');
    }
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function simpleMarkdown(src) {
    // Preserve LaTeX by protecting $...$ and $$...$$
    const slots = [];
    let t = String(src == null ? '' : src);
    t = t.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => {
      slots.push('$$' + m + '$$');
      return '@@MATH' + (slots.length - 1) + '@@';
    });
    t = t.replace(/\\\[([\s\S]+?)\\\]/g, (_, m) => {
      slots.push('\\[' + m + '\\]');
      return '@@MATH' + (slots.length - 1) + '@@';
    });
    t = t.replace(/\$([^$\n]+?)\$/g, (_, m) => {
      slots.push('$' + m + '$');
      return '@@MATH' + (slots.length - 1) + '@@';
    });
    t = t.replace(/\\\(([\s\S]+?)\\\)/g, (_, m) => {
      slots.push('\\(' + m + '\\)');
      return '@@MATH' + (slots.length - 1) + '@@';
    });

    t = escapeHtml(t);
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/\n/g, '<br>');
    t = t.replace(/@@MATH(\d+)@@/g, (_, i) => slots[+i]);
    return t;
  }

  function renderMath(root) {
    if (typeof renderMathInElement !== 'function') return;
    try {
      renderMathInElement(root, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false,
        strict: 'ignore'
      });
    } catch (e) {
      console.warn('KaTeX render warning', e);
    }
  }

  function displaySolution(sol) {
    lastSolution = sol;
    levelBadge.textContent = currentLevel;
    if (sol.readable === false) {
      problemText.innerHTML = simpleMarkdown(sol.note || sol.problem || '이미지를 읽을 수 없어요. 더 선명하게 다시 찍어주세요.');
      stepsText.innerHTML = '';
      answerText.innerHTML = '—';
    } else {
      problemText.innerHTML = simpleMarkdown(sol.problem || '');
      const steps = Array.isArray(sol.steps) ? sol.steps : [];
      stepsText.innerHTML = steps.map((s, i) =>
        `<div class="step"><span class="step-num">${i + 1}</span>${simpleMarkdown(s)}</div>`
      ).join('') + (sol.check ? `<div class="step" style="color:var(--muted);font-size:13px">${simpleMarkdown('검산: ' + sol.check)}</div>` : '');
      answerText.innerHTML = simpleMarkdown(sol.answer || '');
    }
    solutionCard.classList.add('show');
    followAnswer.innerHTML = '';
    followInput.value = '';
    renderMath(solutionCard);
    solutionCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function thumbFromDataUrl(dataUrl, size) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        const side = size || 112;
        c.width = side; c.height = side;
        const ctx = c.getContext('2d');
        const scale = Math.max(side / img.width, side / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (side - w) / 2, (side - h) / 2, w, h);
        resolve(c.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }

  async function saveHistory(sol) {
    if (!currentImageDataUrl || !sol) return;
    let list = [];
    try { list = JSON.parse(localStorage.getItem(LS_HIST) || '[]'); } catch (_) {}
    const thumb = await thumbFromDataUrl(currentImageDataUrl, 112);
    list.unshift({
      id: Date.now().toString(36),
      ts: Date.now(),
      level: currentLevel,
      thumb,
      image: currentImageDataUrl,
      solution: sol,
      preview: (sol.problem || '').replace(/\$+/g, '').slice(0, 60)
    });
    list = list.slice(0, MAX_HIST);
    try {
      localStorage.setItem(LS_HIST, JSON.stringify(list));
    } catch (e) {
      // quota — drop images from older entries
      list = list.map((h, i) => i === 0 ? h : { ...h, image: undefined });
      try { localStorage.setItem(LS_HIST, JSON.stringify(list)); } catch (_) {}
    }
    renderHistory();
  }

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(LS_HIST) || '[]'); }
    catch (_) { return []; }
  }

  function renderHistory() {
    const list = loadHistory();
    if (!list.length) {
      historyList.innerHTML = '<div class="hist-empty">아직 풀이 기록이 없어요</div>';
      return;
    }
    historyList.innerHTML = list.map(h => {
      const d = new Date(h.ts);
      const ds = d.getMonth() + 1 + '/' + d.getDate() + ' ' +
        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      return `<div class="hist-item" data-id="${h.id}">
        <img class="hist-thumb" src="${h.thumb || ''}" alt="">
        <div class="hist-meta">
          <div class="t">${escapeHtml(h.preview || '풀이')}</div>
          <div class="d">${ds} · ${escapeHtml(h.level || '')}</div>
        </div>
      </div>`;
    }).join('');
    historyList.querySelectorAll('.hist-item').forEach(item => {
      item.addEventListener('click', () => {
        const h = loadHistory().find(x => x.id === item.dataset.id);
        if (!h) return;
        if (h.image) {
          currentImageDataUrl = h.image;
          previewImg.src = h.image;
          previewImg.style.display = 'block';
          uploadPlaceholder.style.display = 'none';
          uploadZone.classList.add('has-img');
          btnSolve.disabled = false;
        }
        if (h.level) {
          currentLevel = h.level;
          document.querySelectorAll('.level-btn').forEach(b =>
            b.classList.toggle('active', b.dataset.level === currentLevel)
          );
        }
        displaySolution(h.solution);
      });
    });
  }

  el('btnClearHist').addEventListener('click', () => {
    localStorage.removeItem(LS_HIST);
    renderHistory();
  });

  async function solve(isRetry) {
    if (!currentImageDataUrl && !MOCK) {
      setStatus('err', '먼저 문제 사진을 올려주세요.');
      return;
    }
    btnSolve.disabled = true;
    btnRetry.disabled = true;
    setStatus('info', '<span class="spinner"></span> &nbsp;문제를 읽고 풀이하는 중…');

    try {
      let raw;
      if (MOCK) {
        await new Promise(r => setTimeout(r, 600));
        raw = JSON.stringify(getMockSolution());
        if (!currentImageDataUrl) {
          // generate a simple placeholder "photo" of the problem for history/screenshot
          currentImageDataUrl = await makeMockProblemImage();
          currentImageMime = 'image/png';
          previewImg.src = currentImageDataUrl;
          previewImg.style.display = 'block';
          uploadPlaceholder.style.display = 'none';
          uploadZone.classList.add('has-img');
        }
      } else if (currentProvider === 'openai') {
        raw = await callOpenAI([], currentImageDataUrl);
      } else {
        raw = await callGemini([], currentImageDataUrl);
      }
      const sol = parseSolution(raw);
      displaySolution(sol);
      await saveHistory(sol);
      setStatus('ok', isRetry ? '다시 풀었어요.' : '풀이가 완료됐어요.');
    } catch (err) {
      console.error(err);
      setStatus('err', err.message || '알 수 없는 오류가 났어요.');
      if (err.code === 'NO_KEY') openSettings();
    } finally {
      btnSolve.disabled = !currentImageDataUrl && !MOCK;
      btnRetry.disabled = false;
    }
  }

  function makeMockProblemImage() {
    return new Promise((resolve) => {
      const c = document.createElement('canvas');
      c.width = 900; c.height = 520;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#f7f4ea';
      ctx.fillRect(0, 0, c.width, c.height);
      // ruled paper lines
      ctx.strokeStyle = '#d9e2f0';
      ctx.lineWidth = 1;
      for (let y = 60; y < c.height; y += 36) {
        ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(c.width - 40, y); ctx.stroke();
      }
      ctx.fillStyle = '#1a2332';
      ctx.font = 'bold 28px "Apple SD Gothic Neo", sans-serif';
      ctx.fillText('고등 수학Ⅱ · 미분계수와 접선', 56, 48);
      ctx.font = '22px "Apple SD Gothic Neo", sans-serif';
      const lines = [
        'f(x) = x³ − 3x² + 2 에 대하여',
        '(1)  lim [f(x)−f(1)]/(x−1)   (x→1)',
        '(2)  점 (1, f(1)) 에서의 접선의 방정식'
      ];
      lines.forEach((ln, i) => ctx.fillText(ln, 56, 140 + i * 56));
      ctx.fillStyle = '#4f8cff';
      ctx.font = '16px sans-serif';
      ctx.fillText('모의 문제 이미지 (mock)', 56, c.height - 28);
      resolve(c.toDataURL('image/png'));
    });
  }

  btnSolve.addEventListener('click', () => solve(false));
  btnRetry.addEventListener('click', () => {
    if (!currentImageDataUrl && !MOCK) {
      setStatus('err', '다시 풀 이미지가 없어요.');
      return;
    }
    solve(true);
  });
  btnNew.addEventListener('click', () => {
    currentImageDataUrl = null;
    lastSolution = null;
    previewImg.removeAttribute('src');
    previewImg.style.display = 'none';
    uploadPlaceholder.style.display = 'block';
    uploadZone.classList.remove('has-img');
    btnSolve.disabled = !MOCK;
    solutionCard.classList.remove('show');
    followAnswer.innerHTML = '';
    clearStatus();
    fileInput.value = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  async function askFollowUp() {
    const q = followInput.value.trim();
    if (!q) return;
    if (!lastSolution) {
      setStatus('err', '먼저 문제를 풀어야 추가 질문을 할 수 있어요.');
      return;
    }
    btnFollow.disabled = true;
    followAnswer.innerHTML = '<span class="spinner"></span> 답변 작성 중…';
    try {
      let raw;
      if (MOCK) {
        await new Promise(r => setTimeout(r, 400));
        raw = JSON.stringify({
          readable: true,
          problem: lastSolution.problem,
          steps: [
            '질문: ' + q,
            '접선의 기울기는 그 점에서의 순간변화율(=미분계수)입니다. (1)에서 구한 $f\'(1)=-3$ 이 곧 접선의 기울기예요.',
            '그래서 점 $(1,0)$ 을 지나고 기울기가 $-3$ 인 직선 $y=-3x+3$ 이 접선이 됩니다.'
          ],
          answer: '기울기 $f\'(1)=-3$ → 접선 $y=-3x+3$',
          check: '',
          note: ''
        });
      } else if (currentProvider === 'openai') {
        raw = await callOpenAI([q], null);
      } else {
        raw = await callGemini([q], null);
      }
      const sol = parseSolution(raw);
      const html = (sol.steps || []).map(s => `<div style="margin-bottom:8px">${simpleMarkdown(s)}</div>`).join('') +
        (sol.answer ? `<div class="answer-box" style="margin-top:10px"><div class="label">답</div><div class="ans">${simpleMarkdown(sol.answer)}</div></div>` : '');
      followAnswer.innerHTML = html;
      renderMath(followAnswer);
    } catch (err) {
      followAnswer.innerHTML = '<span style="color:var(--bad)">' + escapeHtml(err.message || String(err)) + '</span>';
    } finally {
      btnFollow.disabled = false;
    }
  }

  btnFollow.addEventListener('click', askFollowUp);
  followInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); askFollowUp(); }
  });

  // init
  loadSettings();
  renderHistory();
  if (MOCK) {
    btnSolve.disabled = false;
    // auto-run mock for screenshot convenience when ?autorun=1
    if (new URLSearchParams(location.search).get('autorun') === '1') {
      const waitKatex = () => new Promise(resolve => {
        let n = 0;
        const t = setInterval(() => {
          n++;
          if (typeof renderMathInElement === 'function' || n > 40) {
            clearInterval(t); resolve();
          }
        }, 100);
      });
      waitKatex().then(() => solve(false));
    }
  }

  window.addEventListener('error', (e) => {
    console.error('window error', e.error || e.message);
  });
})();
</script>
</body>
</html>
